# Seal build workflow for golang.org/x/text.
#
# Upstream x/text ships no GitHub Actions CI (it is tested by Go's own TryBots),
# so this workflow is authored by Seal. It mirrors what the project itself does:
# the Go toolchain declared by the `go` directive in go.mod (1.25.0), and the
# test command named in README.md line 34, `go test ./...`.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Go package/test selector; empty runs the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      # Built in its own module OUTSIDE the checkout so the helper's go.mod and
      # go.sum can never land in the zipped tree.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/createmod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # The workflow and helper above are Seal's own files; upstream x/text has
      # no .github at all, so the whole directory is removed before packing to
      # keep the zip's member set identical to the published one. The job YAML
      # is already loaded at this point, so deleting it mid-run is safe.
      - name: Pack module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/text v0.37.0 \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.37.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.37.0.zip" | tail -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.37.0.zip
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: |
          set -eux
          go build ./...

      - name: Test
        run: |
          set -eux
          go test ${{ inputs.test-filter || './...' }}
